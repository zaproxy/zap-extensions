pscanrules.csp.xcsp.otherinfo = The header X-Content-Security-Policy was found on this response. While it is a good sign that CSP is implemented to some degree the policy specified in this header has not been analyzed by ZAP. To ensure full support by modern browsers ensure that the Content-Security-Policy header is defined and attached to responses.
pscanrules.csp.xwkcsp.name = X-WebKit-CSP
pscanrules.csp.xwkcsp.otherinfo = The header X-WebKit-CSP was found on this response. While it is a good sign that CSP is implemented to some degree the policy specified in this header has not been analyzed by ZAP. To ensure full support by modern browsers ensure that the Content-Security-Policy header is defined and attached to responses.

pscanrules.desc = Release status passive scan rules.

pscanrules.directorybrowsing.desc = It is possible to view a listing of the directory contents. Directory listings may reveal hidden scripts, include files, backup source files, etc., which can be accessed to reveal sensitive information.
pscanrules.directorybrowsing.extrainfo = Web server identified\: {0}
pscanrules.directorybrowsing.name = Directory Browsing
pscanrules.directorybrowsing.refs = https\://cwe.mitre.org/data/definitions/548.html
pscanrules.directorybrowsing.soln = Configure the web server to disable directory browsing.

pscanrules.hashdisclosure.desc = A hash was disclosed by the web server.
pscanrules.hashdisclosure.name = Hash Disclosure
pscanrules.hashdisclosure.refs = https\://openwall.info/wiki/john/sample-hashes
pscanrules.hashdisclosure.soln = Ensure that hashes that are used to protect credentials or other resources are not leaked by the web server or database. There is typically no requirement for password hashes to be accessible to the web browser.

pscanrules.heartbleed.desc = The TLS and DTLS implementations in OpenSSL 1.0.1 before 1.0.1g do not properly handle Heartbeat Extension packets, which allows remote attackers to obtain sensitive information from process memory via crafted packets that trigger a buffer over-read, potentially disclosing sensitive information.
pscanrules.heartbleed.extrainfo = {0} is in use. Note however that the reported version could contain back-ported security fixes, and so the issue could be a false positive. This is common on Red Hat, for instance.
pscanrules.heartbleed.name = Heartbleed OpenSSL Vulnerability (Indicative)
pscanrules.heartbleed.refs = https\://nvd.nist.gov/vuln/detail/cve-2014-0160
pscanrules.heartbleed.soln = Update to OpenSSL 1.0.1g or later. Re-issue HTTPS certificates. Change asymmetric private keys and shared secret keys, since these may have been compromised, with no evidence of compromise in the server log files.

pscanrules.infoprivateaddressdisclosure.desc = A private IP (such as 10.x.x.x, 172.x.x.x, 192.168.x.x) or an Amazon EC2 private hostname (for example, ip-10-0-56-78) has been found in the HTTP response body. This information might be helpful for further attacks targeting internal systems.
pscanrules.infoprivateaddressdisclosure.name = Private IP Disclosure
pscanrules.infoprivateaddressdisclosure.refs = https\://datatracker.ietf.org/doc/html/rfc1918
pscanrules.infoprivateaddressdisclosure.soln = Remove the private IP address from the HTTP response body. For comments, use JSP/ASP/PHP comment instead of HTML/JavaScript comment which can be seen by client browsers.

pscanrules.informationdisclosuredebugerrors.desc = The response appeared to contain common error messages returned by platforms such as ASP.NET, and Web-servers such as IIS and Apache. You can configure the list of common debug messages.
pscanrules.informationdisclosuredebugerrors.name = Information Disclosure - Debug Error Messages
pscanrules.informationdisclosuredebugerrors.soln = Disable debugging messages before pushing to production.

pscanrules.informationdisclosureinurl.desc = The request appeared to contain sensitive information leaked in the URL. This can violate PCI and most organizational compliance policies. You can configure the list of strings for this check to add or remove values specific to your environment.
pscanrules.informationdisclosureinurl.name = Information Disclosure - Sensitive Information in URL
pscanrules.informationdisclosureinurl.otherinfo.cc = The URL appears to contain credit card information.
pscanrules.informationdisclosureinurl.otherinfo.email = The URL contains email address(es).
pscanrules.informationdisclosureinurl.otherinfo.sensitiveinfo = The URL contains potentially sensitive information. The following string was found via the pattern\: {0}\n{1}
pscanrules.informationdisclosureinurl.otherinfo.ssn = The URL appears to contain US Social Security Number(s).
pscanrules.informationdisclosureinurl.soln = Do not pass sensitive information in URIs.

pscanrules.informationdisclosurereferrer.bin.field = Bank Identification Number\:
pscanrules.informationdisclosurereferrer.brand.field = Brand\:
pscanrules.informationdisclosurereferrer.category.field = Category\:
pscanrules.informationdisclosurereferrer.desc = The HTTP header may have leaked a potentially sensitive parameter to another domain. This can violate PCI and most organizational compliance policies. You can configure the list of strings for this check to add or remove values specific to your environment.
pscanrules.informationdisclosurereferrer.issuer.field = Issuer\:
pscanrules.informationdisclosurereferrer.name = Information Disclosure - Sensitive Information in HTTP Referrer Header
pscanrules.informationdisclosurereferrer.otherinfo.cc = The URL in the HTTP referrer header field appears to contain credit card information.
pscanrules.informationdisclosurereferrer.otherinfo.email = The URL in the HTTP referrer header field contains email address(es).
pscanrules.informationdisclosurereferrer.otherinfo.sensitiveinfo = The URL in the HTTP referrer header field appears to contain sensitive information.
pscanrules.informationdisclosurereferrer.otherinfo.ssn = The URL in the HTTP referrer header field appears to contain US Social Security Number(s).
pscanrules.informationdisclosurereferrer.soln = Do not pass sensitive information in URIs.

pscanrules.informationdisclosuresuspiciouscomments.desc = The response appears to contain suspicious comments which may help an attacker.
pscanrules.informationdisclosuresuspiciouscomments.name = Information Disclosure - Suspicious Comments
pscanrules.informationdisclosuresuspiciouscomments.otherinfo = The following pattern was used\: {0} and was detected in likely comment\: "{1}", see evidence field for the suspicious comment/snippet.
pscanrules.informationdisclosuresuspiciouscomments.otherinfo2 = The following pattern was used\: {0} and was detected {2} times, the first in likely comment\: "{1}", see evidence field for the suspicious comment/snippet.
pscanrules.informationdisclosuresuspiciouscomments.soln = Remove all comments that return information that may help an attacker and fix any underlying problems they refer to.

pscanrules.infosessionidurl.desc = URL rewrite is used to track user session ID. The session ID may be disclosed via cross-site referer header. In addition, the session ID might be stored in browser history or server logs.
pscanrules.infosessionidurl.name = Session ID in URL Rewrite
pscanrules.infosessionidurl.referrer.alert = Referer Exposes Session ID
pscanrules.infosessionidurl.referrer.desc = A hyperlink pointing to another host name was found. As session ID URL rewrite is used, it may be disclosed in referer header to external hosts.
pscanrules.infosessionidurl.referrer.soln = This is a risk if the session ID is sensitive and the hyperlink refers to an external or third party host. For secure content, put session ID in secured session cookie.
pscanrules.infosessionidurl.refs = https\://seclists.org/webappsec/2002/q4/111
pscanrules.infosessionidurl.soln = For secure content, put session ID in a cookie. To be even more secure consider using a combination of cookie and URL rewrite.

pscanrules.inpagebanner.desc = The server returned a version banner string in the response content. Such information leaks may allow attackers to further target specific issues impacting the product and version in use.
pscanrules.inpagebanner.name = In Page Banner Information Leak
pscanrules.inpagebanner.other = There is a chance that the highlight in the finding is on a value in the headers, versus the actual matched string in the response body.
pscanrules.inpagebanner.refs = https\://owasp.org/www-project-web-security-testing-guide/v41/4-Web_Application_Security_Testing/08-Testing_for_Error_Handling/
pscanrules.inpagebanner.soln = Configure the server to prevent such information leaks. For example\:\nUnder Tomcat this is done via the "server" directive and implementation of custom error pages.\nUnder Apache this is done via the "ServerSignature" and "ServerTokens" directives.

pscanrules.insecureauthentication.desc = HTTP basic or digest authentication has been used over an unsecured connection. The credentials can be read and then reused by someone with access to the network.
pscanrules.insecureauthentication.name = Weak Authentication Method
pscanrules.insecureauthentication.refs = https\://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
pscanrules.insecureauthentication.soln = Protect the connection using HTTPS or use a stronger authentication mechanism.

pscanrules.insecureformload.desc = This check looks for insecure HTTP pages that host HTTPS forms. The issue is that an insecure HTTP page can easily be hijacked through MITM and the secure HTTPS form can be replaced or spoofed.
pscanrules.insecureformload.extrainfo = The response to the following request over HTTP included an HTTPS form tag action attribute value\:\n\n{0}\nThe context was\:\n\n{1}
pscanrules.insecureformload.name = HTTP to HTTPS Insecure Transition in Form Post
pscanrules.insecureformload.soln = Use HTTPS for landing pages that host secure forms.

pscanrules.insecureformpost.desc = This check identifies secure HTTPS pages that host insecure HTTP forms. The issue is that a secure page is transitioning to an insecure page when data is uploaded through a form. The user may think they're submitting data to a secure page when in fact they are not.
pscanrules.insecureformpost.extrainfo = The response to the following request over HTTPS included an HTTP form tag action attribute value\:\n\n{0}\nThe context was\:\n\n{1}
pscanrules.insecureformpost.name = HTTPS to HTTP Insecure Transition in Form Post
pscanrules.insecureformpost.soln = Ensure sensitive data is only sent over secured HTTPS channels.

pscanrules.insecurejsfviewstate.desc = The response at the following URL contains a ViewState value that has no cryptographic protections.
pscanrules.insecurejsfviewstate.extrainfo = JSF ViewState [{0}] is insecure.
pscanrules.insecurejsfviewstate.name = Insecure JSF ViewState
pscanrules.insecurejsfviewstate.refs = https\://www.trustwave.com/hubfs/21158977/Web/Library/Advisories_txt/14213_twsl2010-001.txt
pscanrules.insecurejsfviewstate.soln = Secure VIEWSTATE with a MAC specific to your environment.

pscanrules.jso.desc = Java Serialization seems to be in use. If not correctly validated, an attacker can send a specially crafted object. This can lead to a dangerous "Remote Code Execution". A magic sequence identifying JSO has been detected (Base64\: rO0AB, Raw\: 0xac, 0xed, 0x00, 0x05).
pscanrules.jso.name = Java Serialization Object
pscanrules.jso.refs = https\://www.oracle.com/java/technologies/javase/seccodeguide.html\#8
pscanrules.jso.soln = Deserialization of untrusted data is inherently dangerous and should be avoided.

pscanrules.linktarget.desc = At least one link on this page is vulnerable to Reverse tabnabbing as it uses a target attribute without using both of the "noopener" and "noreferrer" keywords in the "rel" attribute, which allows the target page to take control of this page.
pscanrules.linktarget.name = Reverse Tabnabbing
pscanrules.linktarget.refs = https\://owasp.org/www-community/attacks/Reverse_Tabnabbing\nhttps\://dev.to/ben/the-targetblank-vulnerability-by-example\nhttps\://mathiasbynens.github.io/rel-noopener/\nhttps\://medium.com/@jitbit/target-blank-the-most-underestimated-vulnerability-ever-96e328301f4c
pscanrules.linktarget.soln = Do not use a target attribute, or if you have to then also add the attribute\: rel\="noopener noreferrer".

pscanrules.mixedcontent.desc = The page includes mixed content, that is content accessed via HTTP instead of HTTPS.
pscanrules.mixedcontent.name = Secure Pages Include Mixed Content
pscanrules.mixedcontent.name.inclscripts = Secure Pages Include Mixed Content (Including Scripts)
pscanrules.mixedcontent.refs = https\://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html
pscanrules.mixedcontent.soln = A page that is available over SSL/TLS must be comprised completely of content which is transmitted over SSL/TLS.\nThe page must not contain any content that is transmitted over unencrypted HTTP.\nThis includes content from third party sites.

pscanrules.modernapp.desc = \u6b64\u61c9\u7528\u7a0b\u5f0f\u770b\u8d77\u4f86\u662f\u4e00\u500b\u73fe\u4ee3\u7db2\u9801\u61c9\u7528\u7a0b\u5f0f\u3002\u5982\u679c\u9700\u8981\u81ea\u52d5\u63a2\u7d22\u5b83\uff0cClient Spider \u53ef\u80fd\u6703\u6bd4\u6a19\u6e96\u7684 Spider \u66f4\u6709\u6548\u3002
