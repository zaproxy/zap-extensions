pscanrules.bigredirects.multi.desc = The server has responded with a redirect that seems to contain multiple links. This may indicate that although the server sent a redirect it also responded with body content links (which may include sensitive details, PII, lead to admin panels, etc.).
pscanrules.bigredirects.multi.extrainfo = The response contained {0} occurrences of "HREF".
pscanrules.bigredirects.multi.name = Multiple HREFs Redirect Detected (Potential Sensitive Information Leak)
pscanrules.bigredirects.name = \u5075\u6e2c\u5230\u5167\u5bb9\u904e\u5927\u7684\u91cd\u65b0\u5c0e\u5411\uff08\u53ef\u80fd\u6d29\u6f0f\u654f\u611f\u8cc7\u8a0a\uff09
pscanrules.bigredirects.soln = \u78ba\u4fdd\u91cd\u65b0\u5c0e\u5411\u56de\u61c9\u4e0d\u6703\u6d29\u6f0f\u4efb\u4f55\u654f\u611f\u8cc7\u8a0a\u3002\u91cd\u65b0\u5c0e\u5411\u56de\u61c9\u61c9\u8a72\u5e7e\u4e4e\u6c92\u6709\u5167\u5bb9\u3002

pscanrules.cachecontrol.desc = cache-control \u6a19\u982d\u672a\u6b63\u78ba\u8a2d\u5b9a\u6216\u4e0d\u5b58\u5728\uff0c\u4f7f\u700f\u89bd\u5668\u548c\u4ee3\u7406\u4f3a\u670d\u5668\u53ef\u4ee5\u5feb\u53d6\u5167\u5bb9\u3002\u5c0d\u65bc CSS\u3001JS \u6216\u5716\u7247\u6a94\u7b49\u975c\u614b\u8cc7\u6e90\uff0c\u9019\u53ef\u80fd\u662f\u523b\u610f\u7684\u8a2d\u8a08\uff0c\u4f46\u4ecd\u61c9\u6aa2\u67e5\u9019\u4e9b\u8cc7\u6e90\uff0c\u78ba\u4fdd\u4e0d\u6703\u5feb\u53d6\u4efb\u4f55\u654f\u611f\u5167\u5bb9\u3002
pscanrules.cachecontrol.name = \u8acb\u91cd\u65b0\u6aa2\u67e5 Cache-Control \u6307\u4ee4
pscanrules.cachecontrol.refs = https\://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html\#web-content-caching\nhttps\://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control\nhttps\://grayduck.mn/2021/09/13/cache-control-recommendations/
pscanrules.cachecontrol.soln = \u5c0d\u65bc\u9700\u8981\u4fdd\u8b77\u7684\u5167\u5bb9\uff0c\u8acb\u78ba\u4fdd cache-control HTTP \u6a19\u982d\u8a2d\u70ba "no-cache, no-store, must-revalidate"\u3002\u82e5\u8cc7\u6e90\u61c9\u8a72\u88ab\u5feb\u53d6\uff0c\u53ef\u8003\u616e\u8a2d\u5b9a "public, max-age, immutable" \u6307\u4ee4\u3002

pscanrules.charsetmismatch.desc = This check identifies responses where the HTTP Content-Type header declares a charset different from the charset defined by the body of the HTML or XML. When there's a charset mismatch between the HTTP header and content body Web browsers can be forced into an undesirable content-sniffing mode to determine the content's correct character set.\n\nAn attacker could manipulate content on the page to be interpreted in an encoding of their choice. For example, if an attacker can control content at the beginning of the page, they could inject script using UTF-7 encoded text and manipulate some browsers into interpreting that text.
pscanrules.charsetmismatch.extrainfo.html.header_metacharset_mismatch = There was a charset mismatch between the HTTP Header and the META charset encoding declaration\: [{0}] and [{1}] do not match.
pscanrules.charsetmismatch.extrainfo.html.header_metacontentype_mismatch = There was a charset mismatch between the HTTP Header and the META content-type encoding declarations\: [{0}] and [{1}] do not match.
pscanrules.charsetmismatch.extrainfo.html.metacontenttype_metacharset_mismatch = There was a charset mismatch between the META charset and the META content-type encoding declaration\: [{0}] and [{1}] do not match.
pscanrules.charsetmismatch.extrainfo.xml = There was a charset mismatch between the HTTP Header and the XML encoding declaration\: [{0}] and [{1}] do not match.
pscanrules.charsetmismatch.name = Charset Mismatch
pscanrules.charsetmismatch.name.header_metacharset_mismatch = Charset Mismatch (Header Versus Meta Charset)
pscanrules.charsetmismatch.name.header_metacontentype_mismatch = Charset Mismatch (Header Versus Meta Content-Type Charset)
pscanrules.charsetmismatch.name.metacontenttype_metacharset_mismatch = Charset Mismatch (Meta Charset Versus Meta Content-Type Charset)
pscanrules.charsetmismatch.refs = https\://code.google.com/archive/p/browsersec/wikis/Part2.wiki\#Character_set_handling_and_detection
pscanrules.charsetmismatch.soln = Force UTF-8 for all text content in both the HTTP header and meta tags in HTML or encoding declarations in XML.

pscanrules.contentsecuritypolicymissing.desc = Content Security Policy (CSP) is an added layer of security that helps to detect and mitigate certain types of attacks, including Cross Site Scripting (XSS) and data injection attacks. These attacks are used for everything from data theft to site defacement or distribution of malware. CSP provides a set of standard HTTP headers that allow website owners to declare approved sources of content that browsers should be allowed to load on that page \u2014 covered types are JavaScript, CSS, HTML frames, fonts, images and embeddable objects such as Java applets, ActiveX, audio and video files.
pscanrules.contentsecuritypolicymissing.name = \u672a\u8a2d\u5b9a\u5167\u5bb9\u5b89\u5168\u653f\u7b56\uff08CSP\uff09\u6a19\u982d
pscanrules.contentsecuritypolicymissing.obs.desc = The "X-Content-Security-Policy" and "X-WebKit-CSP" headers are no longer recommended.
pscanrules.contentsecuritypolicymissing.obs.name = Obsolete Content Security Policy (CSP) Header Found
pscanrules.contentsecuritypolicymissing.refs = https\://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP\nhttps\://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html\nhttps\://www.w3.org/TR/CSP/\nhttps\://w3c.github.io/webappsec-csp/\nhttps\://web.dev/articles/csp\nhttps\://caniuse.com/\#feat\=contentsecuritypolicy\nhttps\://content-security-policy.com/
pscanrules.contentsecuritypolicymissing.ro.desc = The response contained a Content-Security-Policy-Report-Only header, this may indicate a work-in-progress implementation, or an oversight in promoting pre-Prod to Prod, etc.\n\nContent Security Policy (CSP) is an added layer of security that helps to detect and mitigate certain types of attacks, including Cross Site Scripting (XSS) and data injection attacks. These attacks are used for everything from data theft to site defacement or distribution of malware. CSP provides a set of standard HTTP headers that allow website owners to declare approved sources of content that browsers should be allowed to load on that page \u2014 covered types are JavaScript, CSS, HTML frames, fonts, images and embeddable objects such as Java applets, ActiveX, audio and video files.
pscanrules.contentsecuritypolicymissing.ro.name = Content Security Policy (CSP) Report-Only Header Found
pscanrules.contentsecuritypolicymissing.ro.refs = https\://www.w3.org/TR/CSP2/\nhttps\://w3c.github.io/webappsec-csp/\nhttps\://caniuse.com/\#feat\=contentsecuritypolicy\nhttps\://content-security-policy.com/
pscanrules.contentsecuritypolicymissing.soln = \u78ba\u8a8d\u7db2\u9801\u4f3a\u670d\u5668\u3001\u61c9\u7528\u7a0b\u5f0f\u4f3a\u670d\u5668\u3001\u8ca0\u8f09\u5e73\u8861\u5668\u7b49\u5df2\u8a2d\u5b9a Content-Security-Policy \u6a19\u982d\u3002

pscanrules.contenttypemissing.desc = The Content-Type header was either missing or empty.
pscanrules.contenttypemissing.name = Content-Type Header Missing
pscanrules.contenttypemissing.name.empty = Content-Type Header Empty
pscanrules.contenttypemissing.refs = https\://learn.microsoft.com/en-us/previous-versions/windows/internet-explorer/ie-developer/compatibility/gg622941(v\=vs.85)
pscanrules.contenttypemissing.soln = Ensure each page is setting the specific and appropriate content-type value for the content being delivered.

pscanrules.cookiehttponly.desc = A cookie has been set without the HttpOnly flag, which means that the cookie can be accessed by JavaScript. If a malicious script can be run on this page then the cookie will be accessible and can be transmitted to another site. If this is a session cookie then session hijacking may be possible.
pscanrules.cookiehttponly.name = Cookie No HttpOnly Flag
pscanrules.cookiehttponly.refs = https\://owasp.org/www-community/HttpOnly
pscanrules.cookiehttponly.soln = Ensure that the HttpOnly flag is set for all cookies.

pscanrules.cookielooselyscoped.desc = Cookie \u7684\u7bc4\u570d\u53ef\u4ee5\u7528\u7db2\u57df\u6216\u8def\u5f91\u4f86\u9650\u5b9a\uff0c\u6b64\u6aa2\u67e5\u53ea\u95dc\u6ce8\u7db2\u57df\u7bc4\u570d\u3002\u5957\u7528\u5728 cookie \u4e0a\u7684\u7db2\u57df\u7bc4\u570d\u6c7a\u5b9a\u4e86\u54ea\u4e9b\u7db2\u57df\u53ef\u4ee5\u5b58\u53d6\u5b83\u3002\u4f8b\u5982\uff0ccookie \u53ef\u4ee5\u56b4\u683c\u9650\u5b9a\u5728\u67d0\u500b\u5b50\u7db2\u57df\uff0c\u5982 www.nottrusted.com\uff1b\u4e5f\u53ef\u4ee5\u5bec\u9b06\u5730\u9650\u5b9a\u5728\u4e0a\u5c64\u7db2\u57df\uff0c\u5982 nottrusted.com\u3002\u5728\u5f8c\u8005\u7684\u60c5\u6cc1\u4e0b\uff0cnottrusted.com \u7684\u4efb\u4f55\u5b50\u7db2\u57df\u90fd\u80fd\u5b58\u53d6\u8a72 cookie\u3002\u7bc4\u570d\u5bec\u9b06\u7684 cookie \u5728 google.com\u3001live.com \u9019\u985e\u5927\u578b\u61c9\u7528\u7a0b\u5f0f\u4e2d\u5f88\u5e38\u898b\u3002\u5f9e app.foo.bar \u9019\u985e\u5b50\u7db2\u57df\u8a2d\u5b9a\u7684 cookie\uff0c\u700f\u89bd\u5668\u53ea\u6703\u50b3\u9001\u7d66\u8a72\u7db2\u57df\uff1b\u4f46\u7bc4\u570d\u9650\u5b9a\u5728\u4e0a\u5c64\u7db2\u57df\u7684 cookie\uff0c\u5247\u53ef\u80fd\u88ab\u50b3\u9001\u7d66\u4e0a\u5c64\u7db2\u57df\u6216\u5176\u4efb\u4f55\u5b50\u7db2\u57df\u3002
pscanrules.cookielooselyscoped.extrainfo = The origin domain used for comparison was\:\n{0}\n{1}
pscanrules.cookielooselyscoped.extrainfo.cookie = Cookie name\: {0}\n
pscanrules.cookielooselyscoped.name = Cookie \u7bc4\u570d\u904e\u5bec
pscanrules.cookielooselyscoped.refs = https\://datatracker.ietf.org/doc/html/rfc6265\#section-4.1\nhttps\://owasp.org/www-project-web-security-testing-guide/v41/4-Web_Application_Security_Testing/06-Session_Management_Testing/02-Testing_for_Cookies_Attributes.html\nhttps\://code.google.com/archive/p/browsersec/wikis/Part2.wiki
