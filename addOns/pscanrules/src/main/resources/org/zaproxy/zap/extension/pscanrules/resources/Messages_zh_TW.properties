pscanrules.cookiesamesite.badval.desc = A cookie has been set with an invalid SameSite attribute value, which means that the cookie can be sent as a result of a 'cross-site' request. The SameSite attribute is an effective counter measure to cross-site request forgery, cross-site script inclusion, and timing attacks.
pscanrules.cookiesamesite.badval.name = Cookie with Invalid SameSite Attribute
pscanrules.cookiesamesite.desc = A cookie has been set without the SameSite attribute, which means that the cookie can be sent as a result of a 'cross-site' request. The SameSite attribute is an effective counter measure to cross-site request forgery, cross-site script inclusion, and timing attacks.
pscanrules.cookiesamesite.name = Cookie without SameSite Attribute
pscanrules.cookiesamesite.none.desc = \u6709 cookie \u7684 SameSite \u5c6c\u6027\u88ab\u8a2d\u70ba "none"\uff0c\u4ee3\u8868\u8a72 cookie \u53ef\u80fd\u6703\u96a8\u8457\u8de8\u7ad9\u8acb\u6c42\u4e00\u8d77\u9001\u51fa\u3002SameSite \u5c6c\u6027\u80fd\u6709\u6548\u9632\u7bc4\u8de8\u7ad9\u8acb\u6c42\u507d\u9020\u3001\u8de8\u7ad9\u8173\u672c\u5f15\u5165\u53ca\u6642\u5e8f\u653b\u64ca\u3002
pscanrules.cookiesamesite.none.name = Cookie \u7684 SameSite \u5c6c\u6027\u8a2d\u70ba None
pscanrules.cookiesamesite.refs = https\://datatracker.ietf.org/doc/html/draft-ietf-httpbis-cookie-same-site
pscanrules.cookiesamesite.soln = \u78ba\u4fdd\u6240\u6709 cookie \u7684 SameSite \u5c6c\u6027\u90fd\u8a2d\u70ba "lax"\uff0c\u6700\u597d\u662f "strict"\u3002

pscanrules.cookiesecureflag.desc = A cookie has been set without the secure flag, which means that the cookie can be accessed via unencrypted connections.
pscanrules.cookiesecureflag.name = Cookie Without Secure Flag
pscanrules.cookiesecureflag.refs = https\://owasp.org/www-project-web-security-testing-guide/v41/4-Web_Application_Security_Testing/06-Session_Management_Testing/02-Testing_for_Cookies_Attributes.html
pscanrules.cookiesecureflag.soln = Whenever a cookie contains sensitive information or is a session token, then it should always be passed using an encrypted channel. Ensure that the secure flag is set for cookies containing such sensitive information.

pscanrules.crossdomain.desc = \u7531\u65bc\u7db2\u9801\u4f3a\u670d\u5668\u7684\u8de8\u4f86\u6e90\u8cc7\u6e90\u5171\u7528\uff08CORS\uff09\u8a2d\u5b9a\u4e0d\u7576\uff0c\u7db2\u9801\u700f\u89bd\u5668\u53ef\u80fd\u53ef\u4ee5\u8f09\u5165\u8cc7\u6599\u3002
pscanrules.crossdomain.extrainfo = The CORS misconfiguration on the web server permits cross-domain read requests from arbitrary third party domains, using unauthenticated APIs on this domain. Web browser implementations do not permit arbitrary third parties to read the response from authenticated APIs, however. This reduces the risk somewhat. This misconfiguration could be used by an attacker to access data that is available in an unauthenticated manner, but which uses some other form of security, such as IP address white-listing.
pscanrules.crossdomain.name = \u8de8\u7db2\u57df\u8a2d\u5b9a\u932f\u8aa4
pscanrules.crossdomain.refs = https\://vulncat.fortify.com/en/detail?category\=HTML5&subcategory\=Overly%20Permissive%20CORS%20Policy
pscanrules.crossdomain.soln = \u78ba\u4fdd\u654f\u611f\u8cc7\u6599\u4e0d\u6703\u5728\u672a\u7d93\u9a57\u8b49\u7684\u60c5\u6cc1\u4e0b\u88ab\u5b58\u53d6\uff08\u4f8b\u5982\u4f7f\u7528 IP \u4f4d\u5740\u767d\u540d\u55ae\uff09\u3002\n\u5c07 "Access-Control-Allow-Origin" HTTP \u6a19\u982d\u9650\u5b9a\u5728\u7bc4\u570d\u66f4\u5c0f\u7684\u7db2\u57df\uff0c\u6216\u5b8c\u5168\u79fb\u9664\u6240\u6709 CORS \u6a19\u982d\uff0c\u8b93\u7db2\u9801\u700f\u89bd\u5668\u4ee5\u66f4\u56b4\u683c\u7684\u65b9\u5f0f\u57f7\u884c\u540c\u6e90\u653f\u7b56\uff08SOP\uff09\u3002

pscanrules.crossdomainscriptinclusion.desc = The page includes one or more script files from a third-party domain.
pscanrules.crossdomainscriptinclusion.name = Cross-Domain JavaScript Source File Inclusion
pscanrules.crossdomainscriptinclusion.soln = Ensure JavaScript source files are loaded from only trusted sources, and the sources can't be controlled by end users of the application.

pscanrules.csp.desc = Content Security Policy (CSP) is an added layer of security that helps to detect and mitigate certain types of attacks. Including (but not limited to) Cross Site Scripting (XSS), and data injection attacks. These attacks are used for everything from data theft to site defacement or distribution of malware. CSP provides a set of standard HTTP headers that allow website owners to declare approved sources of content that browsers should be allowed to load on that page \u2014 covered types are JavaScript, CSS, HTML frames, fonts, images and embeddable objects such as Java applets, ActiveX, audio and video files.
pscanrules.csp.malformed.name = Malformed Policy (Non-ASCII)
pscanrules.csp.malformed.otherinfo = A non-ASCII character was encountered while attempting to parse the policy, thus rendering it invalid (no further evaluation occurred). The following invalid characters were collected\: {0}
pscanrules.csp.meta.bad.directive.desc = The policy specified via meta element contains either or both the sandbox or frame-ancestors directive, which are not permitted inside meta CSP definitions.
pscanrules.csp.meta.bad.directive.name = Meta Policy Invalid Directive
pscanrules.csp.multipolicy.otherinfo = The response contained {0} Content-Security-Policy policies (header and/or meta). They were analyzed together using browser-style intersection (a resource is allowed only if every policy allows it)\:\n{1}
pscanrules.csp.name = CSP
pscanrules.csp.nofallback.desc = The Content Security Policy fails to define one of the directives that has no fallback. Missing/excluding them is the same as allowing anything.
pscanrules.csp.nofallback.name = Failure to Define Directive with No Fallback
pscanrules.csp.nofallback.otherinfo = The directive(s)\: {0} is/are among the directives that do not fallback to default-src.
pscanrules.csp.notices.errors = Errors\:
pscanrules.csp.notices.infoitems = Info Items\:
pscanrules.csp.notices.name = Notices
pscanrules.csp.notices.warnings = Warnings\:
