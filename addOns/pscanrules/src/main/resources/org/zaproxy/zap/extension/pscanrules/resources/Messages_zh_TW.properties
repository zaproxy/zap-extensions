pscanrules.retrievedfromcache.soln = \u78ba\u8a8d\u56de\u61c9\u4e2d\u4e0d\u5305\u542b\u654f\u611f\u7684\u3001\u500b\u4eba\u7684\u6216\u5c08\u5c6c\u65bc\u7279\u5b9a\u4f7f\u7528\u8005\u7684\u8cc7\u8a0a\u3002\u5982\u679c\u6709\uff0c\u8acb\u8003\u616e\u4f7f\u7528\u4e0b\u5217 HTTP \u56de\u61c9\u6a19\u982d\uff0c\u4ee5\u9650\u5236\u6216\u9632\u6b62\u5167\u5bb9\u88ab\u5feb\u53d6\u5132\u5b58\u4e26\u7531\u5176\u4ed6\u4f7f\u7528\u8005\u53d6\u5f97\uff1a\nCache-Control\: no-cache, no-store, must-revalidate, private\nPragma\: no-cache\nExpires\: 0\n\u6b64\u8a2d\u5b9a\u6703\u6307\u793a\u7b26\u5408 HTTP 1.0 \u548c HTTP 1.1 \u7684\u5feb\u53d6\u4f3a\u670d\u5668\u4e0d\u8981\u5132\u5b58\u6b64\u56de\u61c9\uff0c\u4e26\u4e14\u5728\u6536\u5230\u985e\u4f3c\u8acb\u6c42\u6642\uff0c\u4e0d\u8981\uff08\u672a\u7d93\u9a57\u8b49\u5730\uff09\u5f9e\u5feb\u53d6\u53d6\u5f97\u6b64\u56de\u61c9\u3002

pscanrules.serverheader.rule.name = HTTP Server Response Header

pscanrules.serverheaderinfoleak.desc = The web/application server is leaking the application it uses as a webserver via the "Server" HTTP response header. Access to such information may facilitate attackers identifying other vulnerabilities your web/application server is subject to. This information alone, i.e. without a version string, is not very dangerous for the security of a server, nevertheless this information in the response header field is almost always useless and thus just an obsolete attacking vector.
pscanrules.serverheaderinfoleak.general.refs = https\://httpd.apache.org/docs/current/mod/core.html\#servertokens\nhttps\://learn.microsoft.com/en-us/previous-versions/msp-n-p/ff648552(v\=pandp.10)\nhttps\://www.troyhunt.com/shhh-dont-let-your-response-headers/
pscanrules.serverheaderinfoleak.general.soln = Ensure that your web server, application server, load balancer, etc. is configured to suppress the "Server" header or provide generic details.
pscanrules.serverheaderinfoleak.name = Server Leaks its Webserver Application via "Server" HTTP Response Header Field

pscanrules.serverheaderversioninfoleak.desc = The web/application server is leaking version information via the "Server" HTTP response header. Access to such information may facilitate attackers identifying other vulnerabilities your web/application server is subject to.
pscanrules.serverheaderversioninfoleak.name = Server Leaks Version Information via "Server" HTTP Response Header Field

pscanrules.serversideversion.apache.name = Apache HTTP Server Version with Known Vulnerabilities
pscanrules.serversideversion.apache.name.incomplete = Apache HTTP Server Version with Possible Known Vulnerabilities
pscanrules.serversideversion.apache.otherinfo.assumed = The Apache HTTP Server project lists the version disclosed as only possibly affected by the vulnerabilities listed, so they are not confirmed.
pscanrules.serversideversion.apache.refs = https\://httpd.apache.org/security/vulnerabilities_24.html\nhttps\://httpd.apache.org/security/
pscanrules.serversideversion.apache.soln = Upgrade Apache HTTP Server to a supported version which includes fixes for the listed vulnerabilities. Also configure the server not to disclose its version, e.g. by setting "ServerTokens Prod" and "ServerSignature Off".
pscanrules.serversideversion.apache.tech = Apache HTTP Server
pscanrules.serversideversion.desc = The server disclosed the version of a server side technology it is running via an HTTP response header, and that version is affected by known vulnerabilities. The version, header and vulnerabilities, listed by severity, are given in the other info. See the references for the details of each.\nNote that some distributions backport security fixes without changing the version number, so check whether the fixes have actually been applied before reporting these as confirmed.
pscanrules.serversideversion.desc.incomplete = The server disclosed the version of a server side technology it is running via an HTTP response header, but only partially, e.g. the major and minor version without the patch level. Some releases with that partial version are affected by known vulnerabilities, but the version does not include enough information to be certain that the server is running one of them, so this alert is raised at low risk and low confidence. The version, header and the vulnerabilities which affect any release with that version, listed by severity, are given in the other info. See the references for the details of each.\nNote that some distributions backport security fixes without changing the version number, so check whether the fixes have actually been applied before reporting these as confirmed.
pscanrules.serversideversion.name = Server Side Technology Version with Known Vulnerabilities
pscanrules.serversideversion.nginx.name = nginx Version with Known Vulnerabilities
pscanrules.serversideversion.nginx.name.incomplete = nginx Version with Possible Known Vulnerabilities
pscanrules.serversideversion.nginx.otherinfo.assumed = The vulnerabilities listed only affect nginx on Windows, which the version disclosed does not rule out, so they are not confirmed.
pscanrules.serversideversion.nginx.refs = https\://nginx.org/en/security_advisories.html\nhttps\://nginx.org/en/CHANGES
pscanrules.serversideversion.nginx.soln = Upgrade nginx to a supported version which includes fixes for the listed vulnerabilities. Also configure the server not to disclose its version, e.g. by setting "server_tokens off;".
pscanrules.serversideversion.nginx.tech = nginx
pscanrules.serversideversion.otherinfo.counts = {0} known vulnerabilities\: {1} critical, {2} high, {3} medium, {4} low.
pscanrules.serversideversion.otherinfo.disclosed = The server disclosed that it is running {0} version {1} via the "{2}" HTTP response header.
pscanrules.serversideversion.otherinfo.distribution = The version is followed by "{0}", so this is probably a distribution package. Distributions usually backport security fixes without changing the version, so some or all of the vulnerabilities listed may already be fixed.
pscanrules.serversideversion.otherinfo.severity.critical = Critical\: {0}
pscanrules.serversideversion.otherinfo.severity.high = High\: {0}
pscanrules.serversideversion.otherinfo.severity.low = Low\: {0}
pscanrules.serversideversion.otherinfo.severity.medium = Medium\: {0}
pscanrules.serversideversion.php.name = PHP Version with Known Vulnerabilities
pscanrules.serversideversion.php.name.incomplete = PHP Version with Possible Known Vulnerabilities
pscanrules.serversideversion.php.otherinfo.assumed = The version disclosed is older than any version listed in the advisories, so it is assumed to be affected because older, end-of-life release branches rarely receive fixes.
pscanrules.serversideversion.php.refs = https\://www.php.net/supported-versions.php\nhttps\://github.com/php/php-src/security/advisories
pscanrules.serversideversion.php.soln = Upgrade PHP to a supported version which includes fixes for the listed vulnerabilities. Also configure the server not to disclose the PHP version, e.g. by setting "expose_php \= Off" in php.ini and suppressing version details in the "Server" header.
