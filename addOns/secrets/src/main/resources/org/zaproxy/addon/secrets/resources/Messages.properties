secrets.alert.name = Secrets Disclosure
secrets.desc = A secret (such as an API key, token, or private key) appears to have been disclosed in the response. Attackers can use leaked secrets to gain unauthorized access to services and data.
secrets.name = Secrets Disclosure (Powered by Gitleaks)
secrets.otherinfo = Gitleaks rule: {0} ({1})
secrets.refs = https://github.com/gitleaks/gitleaks
secrets.soln = Remove the secret from the response, revoke it, and issue a new one. Do not embed secrets in client side code or responses, keep them on the server side or in a secrets manager.
