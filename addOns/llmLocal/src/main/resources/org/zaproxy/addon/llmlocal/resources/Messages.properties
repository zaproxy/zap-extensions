llmlocal.download.dialog.warning = Downloads can be multi-gigabyte. Prefer Instruct / tool-capable models (for example Llama-3.2-*-Instruct or granite-*-instruct) if you want MCP tools in chat. TinyLlama and similar chat-only models cannot see tools.
