llmlocal.error.native.simd = Jlama native SIMD is not available. On Java 21 this usually means --enable-preview is missing. Add JVM options --add-modules jdk.incubator.vector --enable-preview, then restart ZAP. Without native SIMD, some Q4 models fail on Apple Silicon with UnsupportedOperationException: ARM_128.
llmlocal.error.vector.api = Local LLM support (Jlama) requires the Java Vector API. Add JVM options --add-modules jdk.incubator.vector --enable-preview to your IDE/run configuration (Options → JVM only applies when starting via zap.sh/zap.bat, not the Dev Build), then restart ZAP.
llmlocal.name = Local LLM Support
