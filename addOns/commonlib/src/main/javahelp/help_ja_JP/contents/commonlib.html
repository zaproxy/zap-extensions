<H1>共通ライブラリ</H1>
アドオン向けのライブラリです。
<p>
「サイト」ツリーには、以下のコンテキストメニュー項目が用意されています:
<ul>
	<li><strong>情報を見る</strong> - そのノードのサブツリーの概要を表示します。表示される内容は以下の通りです:
	<ul>
	    <li>サブツリー内のノードの総数</li>
	    <li>最後に追加されたノードのタイムスタンプ</li>
	    <li>サブツリー内で検出されたリクエストの送信元（プロキシ、認証など）の内訳</li>
	</ul>
    <li><strong>ノードとその子ノードを展開/折りたたむ</strong> - 選択したノードとそのすべての子ノードを再帰的に展開または折りたたみます</li>
</ul>

</BODY>
