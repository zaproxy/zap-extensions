ascanalpha.sqlinjection.desc = SQL injection may be possible.
ascanalpha.sqlinjection.refs = https\://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
ascanalpha.sqlinjection.soln = Ne faites pas confiance aux entr\u00e9es venant du client, m\u00eame si une validation est effectu\u00e9e c\u00f4t\u00e9 client.\nEn g\u00e9n\u00e9ral, contr\u00f4lez le type de toutes les donn\u00e9es c\u00f4t\u00e9 serveur.\nSi l'application utilise JDBC, utilisez un PreparedStatement ou un CallableStatement, en passant les param\u00e8tres avec '?'.\nSi l'application utilise ASP, utilisez les Objects de Commande ADO avec un contr\u00f4le de type strict et des requ\u00eates param\u00e9tr\u00e9es.\nSi des Proc\u00e9dures Stock\u00e9es sont support\u00e9es par la base de donn\u00e9es, utilisez-les.\nNe concat\u00e9nez *pas* des cha\u00eenes de caract\u00e8res pour former des requ\u00eates de Proc\u00e9dures Stock\u00e9es, ou utilisez les fonctions 'exec', 'exec immediate' ou \u00e9quivalentes\!\nNe cr\u00e9ez pas des requ\u00eates SQL dynamiques en utilisant la simple concat\u00e9nation de cha\u00eenes de caract\u00e8res.\nEchappez toutes les donn\u00e9es re\u00e7ues du client.\nAppliquez une 'liste d'autorisation' comprenant les caract\u00e8res accept\u00e9s, ou une 'liste de blocage' des caract\u00e8res interdits dans les donn\u00e9es saisies par l'utilisateur.\nAppliquez le principe du moindre privil\u00e8ge en utilisant l'utilisateur de base de donn\u00e9es ayant les moindres droits possible. Evitez en particulier d'utiliser les utilisateurs de base de donn\u00e9es  'sa' ou 'db-owner'. Ceci n'\u00e9limine pas l'injection SQL, mais minimise son impact.\nAccordez les droits d'acc\u00e8s minimum n\u00e9cessaires \u00e0 l'application.
ascanalpha.sqlinjection.sqlite.alert.timing.error.extrainfo = The following known SQLite error message was provoked\: [{0}].
ascanalpha.sqlinjection.sqlite.alert.timing.extrainfo = The query time is controllable using parameter value [{0}], which caused the request to take [{1}] milliseconds, parameter value [{2}], which caused the request to take [{3}] milliseconds, when the original unmodified query with value [{4}] took [{5}] milliseconds.
ascanalpha.sqlinjection.sqlite.timing.name = SQL Injection - SQLite (Time Based)

ascanalpha.webCacheDeception.desc = Web cache deception may be possible. It may be possible for unauthorised user to view sensitive data on this page.
ascanalpha.webCacheDeception.name = Web Cache Deception
ascanalpha.webCacheDeception.otherinfo = Cached Authorised Response and Unauthorised Response are similar.
ascanalpha.webCacheDeception.refs = https\://blog.cloudflare.com/understanding-our-cache-and-the-web-cache-deception-attack/\nhttps\://www.invicti.com/web-vulnerability-scanner/vulnerabilities/web-cache-deception
ascanalpha.webCacheDeception.soln = It is strongly advised to refrain from classifying file types, such as images or stylesheets solely by their URL and file extension. Instead you should make sure that files are cached based on their Content-Type header.
