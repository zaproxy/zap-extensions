mcp.tool.gethistory.desc = ZAP履歴エントリーで選択した部分を取得します。デフォルトはリクエストおよびレスポンスヘッダーです。ボディを含めるには fields を使用し、大きなボディをページング処理するには body_offset/max_body_chars を使用します（負の body_offset は末尾からカウントします）。ボディが大きくなる可能性がある場合は、zap\://history/{id} よりもこちらを優先してください。
mcp.tool.gethistory.error.invalidid = id パラメーターは数値である必要があります
mcp.tool.gethistory.error.invalidint = {0} パラメーターは整数である必要があります\: {1}
mcp.tool.gethistory.error.invalidmaxbodychars = max_body_chars パラメーターは 0 より大きい必要があります
mcp.tool.gethistory.error.missingid = id パラメーターは必須です
mcp.tool.gethistory.error.notfound = 履歴ID {0} が見つかりません
mcp.tool.gethistory.error.readfailed = 履歴ID {0} の読み込みに失敗しました
mcp.tool.gethistory.error.unknownfield = 不明なフィールド\: {0}。許可されているフィールド\: {1}
mcp.tool.gethistory.param.bodyoffset = 含まれる各ボディへの任意の開始インデックス（0 起算）。負の値は末尾からカウントします（例\: max_body_chars と併用した場合、-2000 は最後の 2000 文字を返します）。
mcp.tool.gethistory.param.fields = 含まれるフィールドのオプション一覧\: requestHeader, requestBody, responseHeader, responseBody。デフォルトは requestHeader および responseHeader です。
mcp.tool.gethistory.param.id = 履歴エントリーID（例\: zap\://history/123 の 123）
mcp.tool.gethistory.param.maxbodychars = 含まれる各ボディで返す最大文字数のオプション（デフォルト 4000）。body_offset とともにリクエストボディとレスポンスボディの両方に適用されます。

