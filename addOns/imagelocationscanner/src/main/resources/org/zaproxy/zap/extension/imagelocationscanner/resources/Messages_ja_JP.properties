imagelocationscanner.alerttitle = 画像が位置情報またはプライバシーデータを公開しています
imagelocationscanner.desc = 画像のEXIFデータに、GPS座標などの位置情報やカメラのシリアル番号などの機密情報が含まれていることが検出されました。Webサイトでの画像の使用状況によっては、この情報によりサイト利用者の個人情報が意図せず公開される恐れがあります。例えば、自宅で撮影したプロフィール写真のアップロードを許可するサイトでは、利用者の自宅住所が特定される可能性があります。
imagelocationscanner.name = 画像位置情報・プライバシースキャナー
imagelocationscanner.refs = https\://www.veggiespam.com/tag/ils/
imagelocationscanner.soln = 画像のサーバーへの保存やブラウザーへの送信を許可する前に、画像に埋め込まれた位置情報を除去してください。これには、すべてのExifデータ、またはGPS情報のみの削除が含まれます。シリアル番号などのその他のデータも削除する必要があります。
