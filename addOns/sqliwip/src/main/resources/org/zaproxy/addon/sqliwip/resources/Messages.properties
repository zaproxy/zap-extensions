sqliwip.desc = SQL injection may be possible. (Experimental modular rule, temporary id -- not for production use.)
sqliwip.name = SQL Injection (Modular, Experimental)
sqliwip.refs = https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
sqliwip.soln = Do not trust client side input, even if there is client side validation in place.\nIn general, type check all data on the server side.\nIf the application uses JDBC, use PreparedStatement or CallableStatement, with parameters passed by '?'\nEscape all data received from the client.\nApply the principle of least privilege by using the least privileged database user possible.
