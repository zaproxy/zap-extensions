<!DOCTYPE html>
<html lang="en">
<head>
	<title>ZAP Test Server</title>
	<link href="/tutorial.css" rel="stylesheet" type="text/css" />
</head>
<body>
<div class="roundContainer">
	<h1>Multi-Step Authentication</h1>
	<h2>Sign In &mdash; Step 3 of 3</h2>
	<p>Enter your password for <strong><!-- USER --></strong> at <strong><!-- DOMAIN --></strong> (<!-- DEPARTMENT -->)</p>

	<form id="loginform" action="login" method="post">
	<input type="hidden" name="user" value="<!-- USER -->">
	<input type="hidden" name="domain" value="<!-- DOMAIN -->">
	<input type="hidden" name="department" value="<!-- DEPARTMENT -->">
	<table style="border: none;">
	<tr>
		<td>Password:</td>
		<td><input id="password" name="password" type="password"></td>
	</tr>
	<tr>
		<td></td>
		<td><button id="signin" type="button" onclick="submitform();">Sign In</button></td>
	</tr>
	</table>
	</form>
</div>
<script>
function submitform() {
	document.getElementById("loginform").submit();
}

document.getElementById('password').onkeydown = function(e) {
	if (e.keyCode == 13) {
		submitform();
	}
};

document.getElementById("password").focus();
</script>
</body>
</html>
