<!DOCTYPE html>
<html lang="en">
<head>
	<title>ZAP Test Server</title>
	<link href="/tutorial.css" rel="stylesheet" type="text/css" />
</head>
<body>
<div class="roundContainer">
	<h1>Slow loading page</h1>
	<p>The server waited <span id="delay"><!-- DELAY --></span> ms before responding.</p>
	<p>State: <span id="state">loading</span></p>
</div>
<script>
	localStorage.setItem('slowLoadedAt', String(Date.now()));
	document.getElementById('state').textContent = 'loaded';
</script>
</body>
</html>
