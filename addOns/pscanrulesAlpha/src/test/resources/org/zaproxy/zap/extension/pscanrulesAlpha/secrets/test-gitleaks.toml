title = "test config"

[allowlist]
description = "global"
stopwords = ["globalstop"]
paths = ['''(?:^|/)vendor/''']
regexes = ['''(?=x)''']

[[rules]]
id = "test-token"
description = "Test token"
regex = '''\b(tok_[a-z0-9]{12})\b'''
entropy = 2
keywords = ["tok_"]
[[rules.allowlists]]
stopwords = ["sample"]
[[rules.allowlists]]
paths = ['''(?:^|/)rulepath/''']

[[rules]]
id = "test-unbounded"
description = "Unbounded run of characters"
regex = '''\b(unb_[a-z0-9]+)\b'''
keywords = ["unb_"]

[[rules]]
id = "test-unsupported"
description = "Allowlists which are not supported"
regex = '''\b(lin_[a-z0-9]{12})\b'''
keywords = ["lin_"]
[[rules.allowlists]]
regexTarget = "line"
regexes = ['''import''']
[[rules.allowlists]]
condition = "AND"
stopwords = ["lin_"]
regexes = ['''lin_''']

[[rules]]
id = "test-incompatible"
description = "Uses a lookahead, not supported by re2j"
regex = '''foo(?=bar)'''
keywords = ["foo"]

[[rules]]
id = "test-path-only"
description = "No regex"
path = '''\.pem$'''

[[rules]]
id = "test-bad-allowlist"
description = "Allowlist with a pattern not supported by re2j"
regex = '''bad_[a-z]{8}'''
[[rules.allowlists]]
regexes = ['''(?<=x)y''']
