httpsinfo.crime.desc = CRIME (Compression Ratio Info-leak Made Easy) は、データ圧縮を使用するHTTPSおよびSPDYプロトコル接続上のWebクッキーに対するセキュリティ攻撃手法です。認証クッキーやセッション管理クッキーの内容を復元するために悪用された場合、攻撃者は認証済みWebセッションでセッションハイジャック（ユーザーのなりすまし）を実行できます。CRIMEにはCVE-2012-4929が割り当てられています。
httpsinfo.crime.name = HTTPS Info\: CRIMEの脆弱性
httpsinfo.crime.refs = https\://en.wikipedia.org/wiki/CRIME
httpsinfo.crime.soln = ほとんどのモダンなクライアント（Webブラウザー）はこの攻撃に対する軽減策を実装しています。サーバー側の軽減策には、SPDY、HTTP圧縮、またはTLS圧縮の無効化が含まれます（ただし、これらの対策にはパフォーマンスへの潜在的な影響が伴います）。
