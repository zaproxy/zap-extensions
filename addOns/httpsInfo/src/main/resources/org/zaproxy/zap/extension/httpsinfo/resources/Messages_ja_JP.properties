httpsinfo.beast.desc = BEAST (Browser Exploit Against SSL/TLS) は2011年に公開された攻撃手法であり、暗号ブロック連鎖 (CBC) の脆弱性を利用してSSLプロトコルを攻撃します。本脆弱性により、暗号化されたHTTPトラフィックに対する中間者 (MitM) 攻撃が可能となり、トラフィックの解読や機密情報の奪取が行われる可能性があります。SSLv3およびTLSv1が影響を受けます。

#Left for potential future re-use
