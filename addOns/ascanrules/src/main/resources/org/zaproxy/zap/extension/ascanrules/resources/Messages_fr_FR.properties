ascanrules.sqlinjection.name = Injection SQL
ascanrules.sqlinjection.name.rdbms = Injection SQL - {0}
ascanrules.sqlinjection.oracle.name = Injection SQL - Oracle (bas\u00e9e sur le temps)
ascanrules.sqlinjection.postgres.name = Injection SQL - PostgreSQL (bas\u00e9e sur le temps)
ascanrules.sqlinjection.refs = https\://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
ascanrules.sqlinjection.soln = Ne faites pas confiance aux entr\u00e9es venant du client, m\u00eame si une validation est effectu\u00e9e c\u00f4t\u00e9 client.\nEn g\u00e9n\u00e9ral, contr\u00f4lez le type de toutes les donn\u00e9es c\u00f4t\u00e9 serveur.\nSi l'application utilise JDBC, utilisez un PreparedStatement ou un CallableStatement, en passant les param\u00e8tres avec '?'.\nSi l'application utilise ASP, utilisez les Objects de Commande ADO avec un contr\u00f4le de type strict et des requ\u00eates param\u00e9tr\u00e9es.\nSi des Proc\u00e9dures Stock\u00e9es sont support\u00e9es par la base de donn\u00e9es, utilisez-les.\nNe concat\u00e9nez *pas* des cha\u00eenes de caract\u00e8res pour former des requ\u00eates de Proc\u00e9dures Stock\u00e9es, ou utilisez les fonctions 'exec', 'exec immediate' ou \u00e9quivalentes\!\nNe cr\u00e9ez pas des requ\u00eates SQL dynamiques en utilisant la simple concat\u00e9nation de cha\u00eenes de caract\u00e8res.\nEchappez toutes les donn\u00e9es re\u00e7ues du client.\nAppliquez une 'liste d'autorisation' comprenant les caract\u00e8res accept\u00e9s, ou une 'liste de blocage' des caract\u00e8res interdits dans les donn\u00e9es saisies par l'utilisateur.\nAppliquez le principe du moindre privil\u00e8ge en utilisant l'utilisateur de base de donn\u00e9es ayant les moindres droits possible. Evitez en particulier d'utiliser les utilisateurs de base de donn\u00e9es  'sa' ou 'db-owner'. Ceci n'\u00e9limine pas l'injection SQL, mais minimise son impact.\nAccordez les droits d'acc\u00e8s minimum n\u00e9cessaires \u00e0 l'application.

