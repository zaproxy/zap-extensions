
ascanrules.bufferoverflow.desc = Les erreurs de d\u00e9bordement de tampon sont caract\u00e9ris\u00e9es par la sur\u00e9criture des espaces de m\u00e9moire du processus en arri\u00e8re-plan, qui ne devraient jamais \u00eatre modifi\u00e9s, intentionnellement ou non. \u00c9craser les valeurs de l'IP (Instruction Pointer), BP (pointeur de Base) et autres registres provoque des exceptions, des erreurs de segmentation et des erreurs dans d'autres processus. Ces erreurs terminent g\u00e9n\u00e9ralement l'ex\u00e9cution de l'application d'une mani\u00e8re inattendue. 
ascanrules.bufferoverflow.name = D\u00e9bordement de tampon
ascanrules.bufferoverflow.other = D\u00e9bordement de tampon potentiel. Le script a ferm\u00e9 la connexion et lanc\u00e9 une erreur interne du serveur 500
ascanrules.bufferoverflow.refs = https\://owasp.org/www-community/attacks/Buffer_overflow_attack
ascanrules.bufferoverflow.soln = R\u00e9\u00e9crire le programme d'arri\u00e8re-plan en utilisant une v\u00e9rification de la longueur de retour correcte.  Cela n\u00e9cessitera une recompilation de l'ex\u00e9cutable d'arri\u00e8re-plan.

ascanrules.cloudmetadata.desc = L'attaque de m\u00e9tadonn\u00e9es cloud tente d'abuser d'un serveur NGINX mal configur\u00e9 afin d'acc\u00e9der aux m\u00e9tadonn\u00e9es d'instance g\u00e9r\u00e9es par des fournisseurs de services cloud tels qu'AWS, GCP et Azure.\nTous ces fournisseurs fournissent des m\u00e9tadonn\u00e9es via une adresse IP interne non routable '169.254.169.254' - cela peut \u00eatre expos\u00e9 par des serveurs NGINX mal configur\u00e9s et accessible en utilisant cette adresse IP dans le champ d'en-t\u00eate Host.
ascanrules.cloudmetadata.name = M\u00e9tadonn\u00e9e du Cloud potentiellement vuln\u00e9rable
ascanrules.cloudmetadata.otherinfo = En fonction du code de statut de la r\u00e9ponse, des m\u00e9tadonn\u00e9es relatives au cloud ont peut-\u00eatre \u00e9t\u00e9 renvoy\u00e9es dans la r\u00e9ponse. V\u00e9rifiez les donn\u00e9es de la r\u00e9ponse pour voir si des m\u00e9tadonn\u00e9es ont \u00e9t\u00e9 envoy\u00e9es.\nLes m\u00e9tadonn\u00e9es renvoy\u00e9es peuvent inclure des informations susceptibles de permettre \u00e0 un pirate de compromettre compl\u00e8tement le syst\u00e8me.
ascanrules.cloudmetadata.refs = https\://blog.nginx.org/blog/trust-no-one-perils-of-trusting-user-input
ascanrules.cloudmetadata.soln = Ne faites confiance \u00e0 aucune donn\u00e9e utilisateur dans les configurations NGINX. Dans ce cas, la variable $host, qui est renseign\u00e9e \u00e0 partir de l'en-t\u00eate 'Host', qui elle-m\u00eame peut \u00eatre contr\u00f4l\u00e9e par un pirate.

ascanrules.codeinjection.desc = Une injonction de code serait possible en incluant un code personnalis\u00e9 qui serait \u00e9valu\u00e9 par le moteur de script.
ascanrules.codeinjection.name = Injection de Code c\u00f4t\u00e9 serveur
ascanrules.codeinjection.name.asp = Injection de Code c\u00f4t\u00e9 serveur - Injection de Code ASP
ascanrules.codeinjection.name.php = Injection de Code c\u00f4t\u00e9 serveur - Injection de Code PHP
ascanrules.codeinjection.refs = https\://cwe.mitre.org/data/definitions/94.html\nhttps\://owasp.org/www-community/attacks/Direct_Dynamic_Code_Evaluation_Eval%20Injection
ascanrules.codeinjection.soln = Ne faites confiance \u00e0 aucune entr\u00e9e provenant du client, m\u00eame si une validation a lieu c\u00f4t\u00e9 client.\nEn g\u00e9n\u00e9ral, v\u00e9rifiez le type de toutes les donn\u00e9es du c\u00f4t\u00e9 serveur et \u00e9chappez toutes les donn\u00e9es re\u00e7ues du client.\nEvitez l'utilisation des fonctions eval() appliqu\u00e9es sur des donn\u00e9es entr\u00e9es par l'utilisateur.

ascanrules.commandinjection.desc = Technique d'attaque utilis\u00e9e pour l'ex\u00e9cution non autoris\u00e9e de commandes du syst\u00e8me d'exploitation. Cette attaque est possible lorsqu'une application accepte des entr\u00e9es douteuses pour g\u00e9n\u00e9rer des commandes de syst\u00e8me d'exploitation vuln\u00e9rables, sans assainissement correct des donn\u00e9es et/ou sans appel correct de programmes externes.
ascanrules.commandinjection.name = Injection de commande de SE \u00e0 distance
ascanrules.commandinjection.otherinfo = La r\u00e8gle de balayage a permis de r\u00e9cup\u00e9rer le contenu d''un fichier ou d''une commande en envoyant [{0}] au syst\u00e8me d''exploitation ex\u00e9cutant cette application.
ascanrules.commandinjection.refs = https\://cwe.mitre.org/data/definitions/78.html\nhttps\://owasp.org/www-community/attacks/Command_Injection

ascanrules.commandinjection.time.name = Injection de Commande de SE \u00e0 Distance (bas\u00e9e sur le temps)
ascanrules.commandinjection.time.otherinfo = La r\u00e8gle de balayage a permis de contr\u00f4ler le temps de r\u00e9ponse de l''application en envoyant [{0}] au Syst\u00e8me d''Exploitation ex\u00e9cutant l''application.

ascanrules.crlfinjection.desc = Le cookie peut \u00eatre renseign\u00e9 par une injection CRLF. Il est aussi possible de d\u00e9finir des en-t\u00eates de r\u00e9ponse HTTP arbitraires. De plus, en \u00e9laborant soigneusement la r\u00e9ponse inject\u00e9e \u00e0 l'aide d'un script intersite, une vuln\u00e9rabilit\u00e9 de type \u00ab cache poisoning \u00bb peut \u00e9galement exister.
ascanrules.crlfinjection.name = Injection CRLF
ascanrules.crlfinjection.refs = https\://owasp.org/www-community/vulnerabilities/CRLF_Injection\nhttps\://cwe.mitre.org/data/definitions/113.html
ascanrules.crlfinjection.soln = V\u00e9rifiez attentivement le type du param\u00e8tre transmis. Filtrez CRLF pour \u00e9viter l'injection d'un CRLF.

ascanrules.crosssitescripting.json.desc = Une attaque XSS a \u00e9t\u00e9 r\u00e9fl\u00e9chie dans la r\u00e9ponse JSON, cela peut rendre vuln\u00e9rable les composants qui consommeront ce contenu s'ils ne g\u00e8rent pas ces donn\u00e9es (r\u00e9ponse JSON) de mani\u00e8re appropri\u00e9e.
ascanrules.crosssitescripting.json.name = Faiblesse Cross Site Scripting (r\u00e9fl\u00e9chi dans la r\u00e9ponse JSON)
ascanrules.crosssitescripting.name = Cross Site Scripting (r\u00e9fl\u00e9chi)
ascanrules.crosssitescripting.otherinfo.accesskey = L'attribut accesskey sp\u00e9cifie une touche de raccourci pour activer/focaliser un \u00e9l\u00e9ment. Cet attribut peut d\u00e9clencher des charges utiles pour des tags non-conventionnels ou personnalis\u00e9s.
ascanrules.crosssitescripting.otherinfo.nothtml = Soulev\u00e9 avec un niveau de confiance FAIBLE car le "Content-Type" n'est pas HTML.

ascanrules.desc = Statut de publication des r\u00e8gles d'analyse actives

ascanrules.directorybrowsing.desc = Il est possible de voir la liste de r\u00e9pertoires. Cette liste peut r\u00e9v\u00e9ler des scripts cach\u00e9s, des fichiers \u00e0 inclure, des fichiers backup de source, etc. pouvant contenir des informations sensibles.
ascanrules.directorybrowsing.name = R\u00e9pertoire de navigation
ascanrules.directorybrowsing.refs = https\://httpd.apache.org/docs/current/mod/core.html\#options
ascanrules.directorybrowsing.soln = D\u00e9sactivez la navigation dans les r\u00e9pertoires. Si n\u00e9cessaire, assurez-vous que les fichiers affich\u00e9s ne pr\u00e9sentent pas de risque.

ascanrules.elmah.desc = Le module de journalisation d'erreur et de gestionnaire HTTP (ELMAH [elmah.axd]) est disponible. Ce module peut laisser \u00e9chapper une quantit\u00e9 importante d\u2019informations pr\u00e9cieuses.
ascanrules.elmah.name = Fuite d\u2019informations ELMAH
ascanrules.elmah.otherinfo = Selon le code du statut de la r\u00e9ponse, ELMAH peut \u00eatre prot\u00e9g\u00e9 par un m\u00e9canisme d'authentification ou d'autorisation.
ascanrules.elmah.refs = https\://www.troyhunt.com/aspnet-session-hijacking-with-google/\nhttps\://www.nuget.org/packages/elmah\nhttps\://elmah.github.io/
ascanrules.elmah.soln = Examinez si ELMAH est r\u00e9ellement n\u00e9cessaire \u00e0 la production, et si ce n\u2019est pas le cas, d\u00e9sactivez-le. S\u2019il est n\u00e9cessaire , assurez-vous que l'acc\u00e8s \u00e0 ELMAH requiert authentification et autorisation. Voir aussi\: https\://elmah.github.io/a/securing-error-log-pages/

ascanrules.entityExpansion.desc = Une expansion exponentielle d'entit\u00e9s, ou attaque "Milliard de Rires", est un type d'attaque par d\u00e9ni de service (DoS). Elle est destin\u00e9e aux analyseurs syntaxiques de langages, comme XML ou YAML, qui permettent l'expansion de macro.
ascanrules.entityExpansion.name = Expansion Exponentielle d'Entit\u00e9s (attaque Milliards de Rires)
ascanrules.entityExpansion.other = La requ\u00eate HTTP d''attaque a re\u00e7u une r\u00e9ponse apr\u00e8s {0} secondes.
ascanrules.entityExpansion.refs = https\://en.wikipedia.org/wiki/Billion_laughs_attack\nhttps\://owasp.org/www-community/vulnerabilities/XML_External_Entity_(XXE)_Processing\nhttps\://cwe.mitre.org/data/definitions/776.html
ascanrules.entityExpansion.soln = Parmi les mesures de protection contre ce type d'attaque, on peut citer la limitation de la m\u00e9moire allou\u00e9e \u00e0 un analyseur syntaxique en particulier, si la perte du document est envisageable. Une autre solution consiste \u00e0 traiter les entit\u00e9s de mani\u00e8re symbolique et ne les d\u00e9velopper de mani\u00e8re diff\u00e9r\u00e9e que lorsque (et dans la mesure o\u00f9) leur contenu doit \u00eatre utilis\u00e9.

ascanrules.envfiles.desc = Un ou plusieurs fichiers .env semblent avoir \u00e9t\u00e9 localis\u00e9s sur le serveur. Ces fichiers exposent fr\u00e9quemment des donn\u00e9es de connexion \u00e0 des comptes administrateurs ou d'infrastructure, \u00e0 des cl\u00e9s d'API ou d'APP, ou d'autres configurations sensibles.
ascanrules.envfiles.name = Fuite d'informations .env
ascanrules.envfiles.otherinfo = Selon le code du statut de la r\u00e9ponse, le fichier .env peut \u00eatre prot\u00e9g\u00e9 par un m\u00e9canisme d'authentification ou d'autorisation.
ascanrules.envfiles.refs = https\://www.google.com/search?q\=db_password+filetype%3Aenv
ascanrules.envfiles.soln = Assurez-vous que le fichier .env est inaccessible.

ascanrules.externalredirect.name = Redirection externe
ascanrules.externalredirect.reason.javascript = La r\u00e9ponse contient une redirection dans son code JavaScript, ce qui permet de d\u00e9finir une Url externe.
ascanrules.externalredirect.reason.location.header = La r\u00e9ponse contient une redirection dans le champ d'en-t\u00eate Location, ce qui permet de d\u00e9finir une Url externe.
ascanrules.externalredirect.reason.location.meta = La r\u00e9ponse contient une redirection pour 'Location' dans sa balise meta http-equiv, ce qui permet de d\u00e9finir une Url externe.
ascanrules.externalredirect.reason.notfound = Aucune raison trouv\u00e9e pour ceci...
ascanrules.externalredirect.reason.refresh.header = La r\u00e9ponse contient une redirection dans le champ d'en-t\u00eate Refresh, ce qui permet de d\u00e9finir une Url externe.
ascanrules.externalredirect.reason.refresh.meta = La r\u00e9ponse contient une redirection pour 'Refresh' dans sa balise meta http-equiv, ce qui permet de d\u00e9finir une Url externe.

ascanrules.formatstring.desc = Une erreur de cha\u00eene de format se produit quand les donn\u00e9es d'une cha\u00eene d'entr\u00e9e sont \u00e9valu\u00e9es comme une commande par l'application.
ascanrules.formatstring.error1 = Erreur potentielle de cha\u00eene de format. Le script a ferm\u00e9 la connexion avec un /%s.
ascanrules.formatstring.error2 = Erreur potentielle de cha\u00eene de format. Le script a ferm\u00e9 la connexion sur un /%s suivi de /%x.
ascanrules.formatstring.error3 = Erreur potentielle de cha\u00eene de format. Le script a ferm\u00e9 la connexion sur une erreur de cha\u00eene de format Microsoft.
ascanrules.formatstring.name = Erreur de format de cha\u00eene
ascanrules.formatstring.refs = https\://owasp.org/www-community/attacks/Format_string_attack
ascanrules.formatstring.soln = R\u00e9\u00e9crivez le programme d'arri\u00e8re-plan en veillant \u00e0 supprimer correctement les cha\u00eenes de caract\u00e8res erron\u00e9es. Ceci n\u00e9cessitera la recompilation de l'ex\u00e9cutable d'arri\u00e8re-plan.

ascanrules.getforpost.desc = Une requ\u00eate initialement identifi\u00e9e comme une requ\u00eate POST a \u00e9galement \u00e9t\u00e9 accept\u00e9e en tant que requ\u00eate GET. Ce probl\u00e8me ne constitue pas en soi une faille de s\u00e9curit\u00e9, mais il peut rendre une autre attaque plus facile. Par exemple, si le POST initial est sujet au Cross-Site Scripting (XSS), cela peut indiquer qu'une XSS bas\u00e9e sur un GET plus simple est \u00e9galement possible.
ascanrules.getforpost.name = GET pour POST
ascanrules.getforpost.soln = Assurez-vous que seul un POST est accept\u00e9 quand un POST est attendu.

ascanrules.heartbleed.desc = L'impl\u00e9mentation de TLS dans OpenSSL 1.0.1 avant 1.0.1g ne g\u00e8re pas correctement les paquets Heartbeat Extension, ce qui permet \u00e0 des attaquants distants d'obtenir des informations sensibles de la m\u00e9moire de processus via des paquets con\u00e7us pour d\u00e9clencher un d\u00e9passement de tampon, avec le potentiel de divulguer des informations sensibles.
ascanrules.heartbleed.extrainfo = Ce probl\u00e8me a \u00e9t\u00e9 confirm\u00e9 par l''exfiltration de donn\u00e9es depuis le serveur, \u00e0 l''aide de {0}. Un faux positif est peu probable.
ascanrules.heartbleed.name = Vuln\u00e9rabilit\u00e9 OpenSSL Heartbleed
ascanrules.heartbleed.refs = https\://nvd.nist.gov/vuln/detail/cve-2014-0160
ascanrules.heartbleed.soln = Mettez \u00e0 jour OpenSSL avec la version 1.0.1g ou ult\u00e9rieure. R\u00e9-\u00e9mettez les certificats HTTPS. Changer les cl\u00e9s priv\u00e9es asym\u00e9triques et les cl\u00e9s secr\u00e8tes partag\u00e9es, car elles peuvent avoir \u00e9t\u00e9 compromises, sans aucun avertissement dans les fichiers journaux du serveur.

ascanrules.hidden.files.alert.name = Fichier cach\u00e9 d\u00e9couvert
ascanrules.hidden.files.desc = Un fichier sensible a \u00e9t\u00e9 identifi\u00e9 comme accessible ou disponible. Ceci peut conduire \u00e0 une fuite d'informations administratives, de configuration ou de donn\u00e9es de connexion, qui peuvent \u00eatre exploit\u00e9es par un individu malveillant pour attaquer le syst\u00e8me ou conduire des actes d'ing\u00e9nierie sociale.
ascanrules.hidden.files.name = Chercheur de fichiers cach\u00e9s
ascanrules.hidden.files.refs = https\://blog.hboeck.de/archives/892-Introducing-Snallygaster-a-Tool-to-Scan-for-Secrets-on-Web-Servers.html
ascanrules.hidden.files.soln = Demandez-vous si ce composant est r\u00e9ellement n\u00e9cessaire en production; si ce n'est pas le cas, d\u00e9sactivez-le. S'il l'est, assurez-vous que l'acc\u00e8s requiert l'authentification ou l'autorisation, ou limitez l'exposition de syst\u00e8mes internes, d'adresses IP de sources sp\u00e9cifiques, ou d'autres donn\u00e9es sensibles.

ascanrules.htaccess.desc = Les fichiers htaccess peuvent \u00eatre utilis\u00e9s pour alt\u00e9rer la configuration du logiciel du serveur internet Apache, ceci afin d'activer ou d\u00e9sactiver des fonctionnalit\u00e9s ou caract\u00e9ristiques offertes par le logiciel du serveur Apache.
ascanrules.htaccess.name = Fuite d'information .htaccess
ascanrules.htaccess.otherinfo = Selon le code de la r\u00e9ponse, le fichier .htaccess est peut-\u00eatre prot\u00e9g\u00e9 par un m\u00e9canisme d'authentification ou d'autorisation.
ascanrules.htaccess.refs = https\://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/Apache_Configuration_htaccess\nhttps\://httpd.apache.org/docs/2.4/howto/htaccess.html
ascanrules.htaccess.soln = S'assurer que le fichier .htaccess n'est pas accessible.

ascanrules.httponlysite.desc = Le site est accessible uniquement via HTTP et non via HTTPS.
ascanrules.httponlysite.name = Site HTTP seulement
ascanrules.httponlysite.otherinfo = {0}\nZAP a tent\u00e9 de se connecter via\: {1}
ascanrules.httponlysite.otherinfo.connectionfail = Echec de la connexion.
ascanrules.httponlysite.otherinfo.differenthosts = Diff\u00e9rents h\u00e9bergeurs.
ascanrules.httponlysite.otherinfo.noredirection = Aucune redirection automatique n'a eu lieu.
ascanrules.httponlysite.otherinfo.nossl = Le site ne prend pas en charge SSL/TLS.
ascanrules.httponlysite.otherinfo.redirectionlimit = Limite de redirection atteinte.
ascanrules.httponlysite.otherinfo.redirecttohttp = Redirig\u00e9 vers HTTP.
ascanrules.httponlysite.otherinfo.urinotencoded = L\u2019URI de redirection n\u2019a pas pu \u00eatre encod\u00e9e
ascanrules.httponlysite.refs = https\://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html\nhttps\://letsencrypt.org/
ascanrules.httponlysite.soln = Configurez votre serveur web ou votre application pour utiliser SSL (HTTPS).

ascanrules.httpsashttp.desc = Un contenu accessible initialement via HTTPS (p.ex. avec chiffrement SSL/TLS) est aussi accessible via HTTP (sans chiffrement).
ascanrules.httpsashttp.name = Contenu HTTPS aussi accessible via HTTP
ascanrules.httpsashttp.otherinfo = ZAP a tent\u00e9 une connexion avec\: {0}
ascanrules.httpsashttp.refs = https\://cheatsheetseries.owasp.org/cheatsheets/HTTP_Strict_Transport_Security_Cheat_Sheet.html\nhttps\://owasp.org/www-community/Security_Headers\nhttps\://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security\nhttps\://caniuse.com/stricttransportsecurity\nhttps\://datatracker.ietf.org/doc/html/rfc6797
ascanrules.httpsashttp.soln = Assurez-vous que votre serveur internet, serveur applicatif, \u00e9quilibreur de charge, etc. est configur\u00e9 pour ne servir ce contenu que via HTTPS. Envisagez d'impl\u00e9menter HTTP Strict Transport Security.

ascanrules.log4shell.cve44228.desc = Les fonctionnalit\u00e9s JNDI de Apache log4j2 <\=2.14.1 utilis\u00e9es dans la configuration, les messages de journalisation et les param\u00e8tres n'offrent aucune protection contre les points de terminaison LDAP et autres points de terminaison li\u00e9s \u00e0 JNDI contr\u00f4l\u00e9s par des attaquants. Un attaquant pouvant contr\u00f4ler les messages de journalisation ou leurs param\u00e8tres peut ex\u00e9cuter du code arbitraire charg\u00e9 depuis un serveur LDAP lorsque la substitution de message est activ\u00e9e. Ce comportement est d\u00e9sactiv\u00e9 par d\u00e9faut \u00e0 partir de log4j 2.15.0.
ascanrules.log4shell.cve44228.name = Log4Shell (CVE-2021-44228)
ascanrules.log4shell.cve44228.refs = https\://github.com/lunasec-io/lunasec/blob/c6bb0762b4ce308768baca72c7e34415402e9647/docs/blog/2021-12-09-log4j-zero-day.mdx\nhttps\://nvd.nist.gov/vuln/detail/cve-2021-44228
ascanrules.log4shell.cve44228.soln = Mettez \u00e0 jour Log4j2 vers la version 2.17.1 ou plus r\u00e9cente. Dans les versions pr\u00e9c\u00e9dentes (>2.10), ce comportement peut \u00eatre \u00e9vit\u00e9 en renseignant le param\u00e8tre syst\u00e8me"log4j2.formatMsgNoLookups" avec "true" ou en supprimant la classe JndiLookup du classpath (p.ex.\: zip -q -d log4j-core-*.jar org/apache/logging/log4j/core/lookup/JndiLookup.class). Java 8u121 (voir https\://www.oracle.com/java/technologies/javase/8u121-relnotes.html) prot\u00e8ge contre l'ex\u00e9cution de code \u00e0 distance en renseignant par d\u00e9faut  "com.sun.jndi.rmi.object.trustURLCodebase" et "com.sun.jndi.cosnaming.object.trustURLCodebase" avec "false".
ascanrules.log4shell.cve45046.desc = Il s'est av\u00e9r\u00e9 que le correctif \u00e0 CVE-2021-44228 dans Apache Log4j 2.15.0 \u00e9tait incompl\u00e8te dans certaines configurations personnalis\u00e9es. Cela pourrait permettre \u00e0 un attaquant de cr\u00e9er des donn\u00e9es d'entr\u00e9e malveillantes \u00e0 l'aide d'un mod\u00e8le de recherche JNDI, duquel pourrait r\u00e9sulter une fuite d'informatrion ou l'ex\u00e9cution de code \u00e0 distance dans certains environnements.
ascanrules.log4shell.cve45046.name = Log4Shell (CVE-2021-45046)
ascanrules.log4shell.cve45046.refs = https\://github.com/lunasec-io/lunasec/blob/c6bb0762b4ce308768baca72c7e34415402e9647/docs/blog/2021-12-09-log4j-zero-day.mdx\nhttps\://nvd.nist.gov/vuln/detail/cve-2021-45046
ascanrules.log4shell.cve45046.soln = Upgrade Log4j2 to version 2.17.1 or newer.
ascanrules.log4shell.name = Log4Shell
ascanrules.log4shell.skipped = no Active Scan OAST service is selected

ascanrules.name = R\u00e8gles d'analyse active

ascanrules.paddingoracle.desc = By manipulating the padding on an encrypted string, an attacker is able to generate an error message that indicates a likely 'padding oracle' vulnerability. Such a vulnerability can affect any application or framework that uses encryption improperly, such as some versions of ASP.net, Java Server Faces, and Mono. An attacker may exploit this issue to decrypt data and recover encryption keys, potentially viewing and modifying confidential data. This rule should detect the MS10-070 padding oracle vulnerability in ASP.net if CustomErrors are enabled for that.
ascanrules.paddingoracle.name = Bourrage Oracle g\u00e9n\u00e9rique
ascanrules.paddingoracle.refs = https\://learn.microsoft.com/en-us/security-updates/securitybulletins/2010/ms10-070\nhttps\://www.mono-project.com/docs/about-mono/vulnerabilities/\nhttps\://bugzilla.redhat.com/show_bug.cgi?id\=623799
ascanrules.paddingoracle.soln = Mettez \u00e0 jour le logiciel de serveur affect\u00e9, ou modifiez les scripts afin qu'ils valident correctement les donn\u00e9es chiffr\u00e9es avant toute tentative de d\u00e9chiffrement.

