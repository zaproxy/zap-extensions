ascanrules.react2shell.desc = The server is running Next.js and vulnerable versions of React Server Components with Next.js which allow remote attackers to execute arbitrary code.
ascanrules.react2shell.name = Remote Code Execution (React2Shell)
ascanrules.react2shell.otherinfo = The attack verifies that the server is running vulnerable React Server Components, and that the remote code execution (RCE) vulnerability is present without causing any damage.\nIt forces an error via a malformed multipart request and checks for the presence of a string which confirms RCE is possible.
ascanrules.react2shell.refs = https\://react2shell.com/\nhttps\://react.dev/blog/2025/12/03/critical-security-vulnerability-in-react-server-components\nhttps\://www.slcyber.io/research/high-fidelity-detection-mechanism-for-rsc-next-js-rce-cve-2025-55182-cve-2025-66478
