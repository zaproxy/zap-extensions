ascanrules.sqlinjection.authbypass.name = Injection SQL - Contournement de l'authentification
ascanrules.sqlinjection.desc = SQL injection may be possible.
ascanrules.sqlinjection.hypersonic.name = Injection SQL - Hypersonic SQL (bas\u00e9e sur le temps)
ascanrules.sqlinjection.mssql.alert.timebased.extrainfo = La dur\u00e9e de la requ\u00eate peut \u00eatre contr\u00f4l\u00e9e en utilisant le param\u00e8tre [{0}]\: la requ\u00eate prend [{1}] millisecondes, alors que la requ\u00eate d''origine non modifi\u00e9e a pris [{3}] millisecondes avec la valeur [{2}].
