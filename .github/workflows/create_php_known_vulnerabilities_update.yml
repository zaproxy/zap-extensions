name: Create PHP Known Vulnerabilities Update PR

on:
  schedule:
    - cron:  '0 4 * * 4'
  workflow_dispatch:

jobs:
  create_pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    steps:
    - name: Build Feature Branch and Raise PR
      run: |
        # Setup git details
        export GITHUB_USER=zapbot
        git config --global user.email "12745184+zapbot@users.noreply.github.com"
        git config --global user.name $GITHUB_USER
        # Clone repo
        git clone -o upstream https://github.com/zaproxy/zap-extensions.git
        cd zap-extensions
        git remote add origin https://github.com/$GITHUB_USER/zap-extensions.git
        # Setup env vars for later
        BRANCH="php-known-vulnerabilities-update"
        SHORT_DATE="$(date +"%Y-%m-%d")"
        # Build the feature branch
        git checkout -b $BRANCH
        # Regenerate the file from the php-src security advisories
        GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} ./gradlew :addOns:pscanrules:updatePhpKnownVulnerabilities
        export GITHUB_TOKEN=${{ secrets.ZAPBOT_TOKEN }}
        ## Update the index to be sure git is aware of changes
        git update-index -q --refresh
        ## If there are changes: comment, commit, PR
        if ! git diff-index --quiet HEAD --; then
          ./gradlew :addOns:pscanrules:updateChangelog --change="- Updated PHP known vulnerabilities from the php-src security advisories."
          git remote set-url origin https://$GITHUB_USER:$GITHUB_TOKEN@github.com/$GITHUB_USER/zap-extensions.git
          git add .
          git commit -m "PHP Known Vulnerabilities Update $SHORT_DATE" -m "Updates based on https://github.com/php/php-src/security/advisories" --signoff
          git push --set-upstream origin $BRANCH --force
          # Open the PR
          gh pr create -f
        fi
